# AgentOps Skills Marketplace
# Source of truth for all skills and plugins.
# marketplace.json is generated from this file — do not edit it directly.

name: agentops-redhatskills
description: >
  Skills for the Red Hat AI AgentOps documentation site.
owner:
  name: eformat

categories:
  agent-frameworks:
    name: Agent Frameworks
    description: Skills for scaffolding and building AI agents

plugins:

  - name: langchain-agent
    description: >
      Scaffold a basic LangChain/LangGraph ReAct agent with a tool,
      wired to any OpenAI-compatible endpoint (OpenAI, vLLM, Ollama,
      RHOAI Model-as-a-Service).
    version: "0.1.0"
    category: agent-frameworks
    tags: [langchain, langgraph, react-agent, scaffolding, openai]
    author:
      name: eformat
    source:
      type: github
      repo: eformat/agentops-redhatskills-com
      ref: main
    strict: false
    skills_dir: skills/langchain-agent
    homepage: https://github.com/eformat/agentops-redhatskills-com
    repository: https://github.com/eformat/agentops-redhatskills-com
    skills:
      - name: langchain-agent
        description: Scaffold a basic LangChain/LangGraph ReAct agent with a tool
        user-invocable: true
    harnesses:
      claude-code:
        install: "/plugin install langchain-agent@agentops-redhatskills"
    depends_on: []

